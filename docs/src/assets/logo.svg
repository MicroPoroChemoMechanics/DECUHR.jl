<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <title>DECUHR.jl</title>
  <!-- hyper-rectangle d'integration et sa premiere subdivision -->
  <g stroke="#CCCCCC" stroke-width="18" fill="none">
    <rect x="90" y="90" width="420" height="420"/>
    <line x1="300" y1="90" x2="300" y2="510"/>
    <line x1="90" y1="300" x2="510" y2="300"/>
  </g>
  <!-- subdivisions adaptatives successives, concentrees sur le coin bas-gauche -->
  <g stroke="#FFFFFF" stroke-width="10">
    <rect x="90" y="300" width="210" height="210" fill="#4063D8"/>
    <rect x="90" y="405" width="105" height="105" fill="#9558B2"/>
    <rect x="90" y="457" width="53" height="53" fill="#389826"/>
  </g>
  <!-- sommet singulier -->
  <rect x="90" y="484" width="26" height="26" fill="#CB3C33"/>
